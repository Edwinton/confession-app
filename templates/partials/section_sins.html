{% raw %}
<script type="text/template" id="tpl-section-sins">
  <div class="section active" data-section-id="{{sectionId}}">
    <h2>
      <span class="num">{{num}}</span>
      <span>{{title}}</span>
    </h2>
    <p class="sub">{{sub}}</p>

    {{#if verse}}
    <p class="section-verse">{{verse}}</p>
    {{/if}}

    <div class="groups-container">
      {{#each groups}}
        <div class="group" data-group-index="{{groupIndex}}">
          <h3 class="group-title">{{title}}</h3>
          <div class="sin-list">
            {{#each sins}}
              <div class="sin-item" data-sin-key="{{sectionId}}::{{groupIndex}}::{{@index}}">
                <div class="sin-check" onclick="toggleSin(this.closest('.sin-item'))"></div>
                <div class="sin-label" onclick="toggleSin(this.closest('.sin-item'))">
                  <span class="en">{{en}}</span>
                  <span class="ml">{{ml}}</span>
                </div>
                {{#if note}}
                  <button type="button"
                          class="sin-info"
                          aria-label="More information"
                          onclick="event.stopPropagation(); toggleSinNote(this);"
                          data-note-en="{{noteEn}}"
                          data-note-ml="{{noteMl}}"></button>
                {{/if}}
              </div>
            {{/each}}
          </div>
        </div>
      {{/each}}
    </div>

    {{#if guardrail}}
    <div class="gentle-note section-note">{{guardrail}}</div>
    {{/if}}
  </div>
</script>
{% endraw %}
