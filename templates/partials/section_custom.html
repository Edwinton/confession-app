{% raw %}
<script type="text/template" id="tpl-section-custom">
  <div class="section active" data-section-id="{{sectionId}}">
    <h2>
      <span class="num">{{num}}</span>
      <span>{{title}}</span>
    </h2>
    <p class="sub">{{sub}}</p>

    <textarea
      id="customInput"
      maxlength="{{maxlength}}"
      placeholder="{{placeholder}}"
      class="custom-textarea"></textarea>
    <div class="char-counter" id="customCounter">0 / {{maxlength}}</div>
  </div>
</script>
{% endraw %}
