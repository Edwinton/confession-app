{% raw %}
<script type="text/template" id="tpl-summary">
  <div class="summary-section">
    <h2 data-i18n="summaryTitle">Your Confession Summary</h2>
    <p class="sub" data-i18n="summarySub">
      Review your selected sins, then download as PDF
    </p>

    <div id="summaryContent"></div>

    <div class="protect-panel">
      <div class="protect-row">
        <input type="checkbox" id="protectCheckbox" onchange="togglePasswordFields()">
        <label for="protectCheckbox" data-i18n="protectLabel">
          🔒 Protect PDF with a password
        </label>
      </div>
      <div class="password-fields" id="passwordFields">
        <input type="password" id="pdfPassword"
               data-i18n-placeholder="passwordPlaceholder"
               placeholder="Enter password" autocomplete="new-password">
        <input type="password" id="pdfPasswordConfirm"
               data-i18n-placeholder="passwordConfirmPlaceholder"
               placeholder="Confirm password" autocomplete="new-password">
        <div class="password-hint" data-i18n="passwordHint">
          This password will be required to open the PDF.
        </div>
        <div class="password-error" id="passwordError"></div>
      </div>
    </div>

    <div class="download-row">
      <button class="btn btn-primary" onclick="downloadPDF()">
        <span data-i18n="downloadBtn">Download PDF</span>
      </button>
    </div>

    <div class="nav-row">
      <button class="btn btn-secondary" onclick="prevSection()">
        <span data-i18n="back">← Back</span>
      </button>
      <button class="btn btn-secondary" onclick="resetAll()">
        <span data-i18n="startOver">Start Over</span>
      </button>
    </div>
  </div>
</script>
{% endraw %}
